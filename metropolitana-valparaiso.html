<script>
// Segunda dirección del webinar del 2-oct-2026, la que nombra las DOS regiones.
// Pedida por Rayen el 22-sep-2026: la dirección original dice solo "region-

// ⚠ NO REEMPLAZA a region-metropolitana.html, la AGREGA. La original tiene que

//
// Esta dirección es para lo que se mande DE AQUÍ EN ADELANTE.
//
// Mismo patrón que rm/index.html: conserva ?src= y utm_source para no perder la
// medición por canal. Si nadie trae ?src=, se etiqueta como "rmv", así que el
// tráfico de esta dirección se puede separar del de la original y del directo.
(function () {
  var p = new URLSearchParams(location.search);
  var destino = new URL('https://webinar.opencluster-tech.cl/region-metropolitana.html');
  destino.searchParams.set('src', p.get('src') || 'rmv');
  if (p.get('utm_source')) destino.searchParams.set('utm_source', p.get('utm_source'));
  location.replace(destino.toString());
})();
</script>
