<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webinar PIE Región Metropolitana 2026</title>
<link rel="canonical" href="https://webinar.opencluster-tech.cl/region-metropolitana.html">
<meta name="robots" content="noindex">
<script>
// Esta página era el SONDEO de la Región Metropolitana: recogía interés cuando la
// campaña todavía no tenía fecha, y guardaba en la pestaña PIE_RM_2026 contra un
// despliegue de Apps Script distinto del de esta campaña.
//
// El 6-sep-2026 la RM ya tiene fecha —viernes 2 de octubre— y su propia landing,
// así que el sondeo dejó de tener sentido: quien se inscribiera acá quedaba fuera
// de la campaña real, sin que nada lo avisara.
//
// NO se borró el archivo por dos razones: confirmar.html lo enlaza como página de
// inscripción de la RM, y el enlace ya anda compartido desde el sondeo.
//
// Mismo patrón que biobio.html y nuble.html: conserva ?src= y utm_source. Sin
// etiqueta, marca la visita como "sondeo-rm", para poder separar a los que llegan
// por el enlace viejo.
(function () {
  var p = new URLSearchParams(location.search);
  var destino = new URL('https://webinar.opencluster-tech.cl/region-metropolitana.html');
  destino.searchParams.set('src', p.get('src') || 'sondeo-rm');
  if (p.get('utm_source')) destino.searchParams.set('utm_source', p.get('utm_source'));
  location.replace(destino.toString());
})();
</script>
</head>
<body style="font-family:Arial,sans-serif;padding:40px;text-align:center;color:#1a2535;">
  <p>Ya hay fecha: el webinar de la Región Metropolitana es el <strong>viernes 2 de octubre, 16:00 h</strong>.</p>
  <p>Te estamos llevando al formulario de inscripción…</p>
  <p><a href="https://webinar.opencluster-tech.cl/region-metropolitana.html?src=sondeo-rm">Webinar PIE Región Metropolitana — inscripción</a></p>
</body>
</html>
