<!DOCTYPE html>

<meta name="robots" content="noindex">
<script>
// Esta página se unificó: Biobío y Ñuble comparten el mismo webinar y ahora
// el formulario es uno solo, con la región como campo. Se mantiene el archivo
// para que los enlaces ya compartidos sigan funcionando. Se conserva el ?src=
// de la campaña para no perder la medición por canal.
(function () {
  const p = new URLSearchParams(location.search);
  const destino = new URL('biobio-nuble.html', location.href);
  destino.searchParams.set('region', 'biobio');
  if (p.get('src')) destino.searchParams.set('src', p.get('src'));
  if (p.get('utm_source')) destino.searchParams.set('utm_source', p.get('utm_source'));
  location.replace(destino.toString());
})();
</script>
</head>
